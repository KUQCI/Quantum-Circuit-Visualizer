name: Render lesson videos

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "lib/learning/**"
      - "lib/step-explanations.ts"
      - "components/learning/WalkthroughStage.tsx"
      - "app/walkthrough-video/**"
      - "scripts/render-lesson-videos.py"
      - ".github/workflows/lesson-videos.yml"

permissions:
  contents: write

concurrency:
  group: lesson-videos
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build static site
        run: npm run build:pages
        env:
          GITHUB_PAGES: "true"
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Serve exported site on port 3005
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          mkdir -p "$RUNNER_TEMP/pages/$REPOSITORY_NAME"
          cp -a out/. "$RUNNER_TEMP/pages/$REPOSITORY_NAME/"
          nohup python -m http.server 3005 --directory "$RUNNER_TEMP/pages" \
            >"$RUNNER_TEMP/pages-server.log" 2>&1 </dev/null &
          for attempt in $(seq 1 30); do
            if curl --fail --silent "http://localhost:3005/$REPOSITORY_NAME/"; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/pages-server.log"
          exit 1
      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install "playwright==1.63.0" "piper-tts==1.8.0"
          python -m playwright install --with-deps chromium
      - name: Download pinned Lessac voice
        run: |
          mkdir -p "$RUNNER_TEMP/piper"
          base="https://huggingface.co/rhasspy/piper-voices/resolve/c10ece1aade47bb51c153c893d14e5bf8e5b7117/en/en_US/lessac/medium"
          curl --fail --location --retry 3 "$base/en_US-lessac-medium.onnx" \
            -o "$RUNNER_TEMP/piper/en_US-lessac-medium.onnx"
          curl --fail --location --retry 3 "$base/en_US-lessac-medium.onnx.json" \
            -o "$RUNNER_TEMP/piper/en_US-lessac-medium.onnx.json"
          test -s "$RUNNER_TEMP/piper/en_US-lessac-medium.onnx"
          test -s "$RUNNER_TEMP/piper/en_US-lessac-medium.onnx.json"
      - name: Render all lesson videos
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          python scripts/render-lesson-videos.py \
            --base-url "http://localhost:3005/$REPOSITORY_NAME" \
            --voice "$RUNNER_TEMP/piper/en_US-lessac-medium.onnx" \
            --out videos
      - name: Create release and upload videos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view lesson-videos >/dev/null 2>&1; then
            gh release create lesson-videos \
              --title "Lesson walkthrough videos" \
              --notes "Generated lesson walkthrough videos, captions, and manifest." \
              --latest=false
          fi
          gh release upload lesson-videos \
            videos/*.mp4 videos/*.vtt videos/lesson-videos.json \
            --clobber
