name: Render lesson videos

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "lib/learning/**"
      - "lib/step-explanations.ts"
      - "components/learning/WalkthroughStage.tsx"
      - "app/walkthrough-video/**"
      - "scripts/render-lesson-videos.py"
      - "scripts/animated-videos/**"
      - ".github/workflows/lesson-videos.yml"

permissions:
  contents: write

concurrency:
  group: lesson-videos
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build static site
        run: npm run build:pages
        env:
          GITHUB_PAGES: "true"
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Serve exported site on port 3005
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          mkdir -p "$RUNNER_TEMP/pages/$REPOSITORY_NAME"
          cp -a out/. "$RUNNER_TEMP/pages/$REPOSITORY_NAME/"
          nohup python -m http.server 3005 --directory "$RUNNER_TEMP/pages" \
            >"$RUNNER_TEMP/pages-server.log" 2>&1 </dev/null &
          for attempt in $(seq 1 30); do
            if curl --fail --silent "http://localhost:3005/$REPOSITORY_NAME/"; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/pages-server.log"
          exit 1
      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libcairo2-dev libpango1.0-dev pkg-config
          python -m pip install "playwright==1.63.0" \
            -r scripts/animated-videos/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Download pinned Kokoro model
        run: |
          mkdir -p "$RUNNER_TEMP/kokoro"
          base="https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0"
          curl --fail --location --retry 3 "$base/kokoro-v1.0.onnx" \
            -o "$RUNNER_TEMP/kokoro/kokoro-v1.0.onnx"
          curl --fail --location --retry 3 "$base/voices-v1.0.bin" \
            -o "$RUNNER_TEMP/kokoro/voices-v1.0.bin"
          printf '%s  %s\n' \
            "7d5df8ecf7d4b1878015a32686053fd0eebe2bc377234608764cc0ef3636a6c5" \
            "$RUNNER_TEMP/kokoro/kokoro-v1.0.onnx" \
            "bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d" \
            "$RUNNER_TEMP/kokoro/voices-v1.0.bin" | sha256sum --check
      - name: Render all lesson videos
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          python scripts/render-lesson-videos.py \
            --base-url "http://localhost:3005/$REPOSITORY_NAME" \
            --model "$RUNNER_TEMP/kokoro/kokoro-v1.0.onnx" \
            --voices "$RUNNER_TEMP/kokoro/voices-v1.0.bin" \
            --voice-name af_heart \
            --out videos
      - name: Render animated lesson videos
        run: |
          python scripts/animated-videos/render.py --self-check
          animated_out="$RUNNER_TEMP/animated-videos"
          mkdir -p "$animated_out"
          python scripts/animated-videos/render.py \
            --out "$animated_out" \
            --model "$RUNNER_TEMP/kokoro/kokoro-v1.0.onnx" \
            --voices "$RUNNER_TEMP/kokoro/voices-v1.0.bin" \
            --voice-name af_heart
          shopt -s nullglob
          for artifact in "$animated_out"/*.mp4 "$animated_out"/*.vtt; do
            cp "$artifact" videos/
          done
      - name: Create release and upload videos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view lesson-videos >/dev/null 2>&1; then
            gh release create lesson-videos \
              --title "Lesson walkthrough videos" \
              --notes "Generated lesson walkthrough videos, captions, and manifest." \
              --latest=false
          fi
          gh release upload lesson-videos \
            videos/*.mp4 videos/*.vtt videos/lesson-videos.json \
            videos/speech-*.mp3 \
            --clobber
          while IFS= read -r name; do
            if [[ "$name" == speech-*.mp3 && ! -f "videos/$name" ]]; then
              gh release delete-asset lesson-videos "$name" -y
            fi
          done < <(gh release view lesson-videos --json assets -q '.assets[].name')
